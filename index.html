```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Star Fashion - Painel do Vendedor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        /* Efeito de brilho neon para o campo focado, inspirado na foto */
        .input-glow-focus:focus-within {
            box-shadow: 0 0 15px 2px rgba(56, 189, 248, 0.6);
            border-color: #38bdf8; /* Tailwind cyan-400 */
        }
        
        /* Cor de fundo do input similar a foto (cinza/azul bem escuro) */
        .input-bg {
            background-color: #171b26; 
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-600 via-blue-700 to-blue-900 p-4">

    <!-- Container do Login -->
    <div class="w-full max-w-md bg-transparent">
        
        <!-- Cabeçalho / Títulos -->
        <div class="text-center mb-10">
            <h2 class="text-blue-300 font-medium tracking-wider text-sm mb-2 uppercase">Big Star Fashion • Painel do Vendedor</h2>
            <h1 class="text-4xl font-bold text-white mb-3">Bem-vindo de volta!</h1>
            <p class="text-blue-100 text-base">Faça login para acessar o painel administrativo.</p>
        </div>

        <!-- Formulário -->
        <form id="loginForm" class="space-y-6" onsubmit="handleLogin(event)">
            
            <!-- Campo Usuário -->
            <div>
                <label for="username" class="block text-white font-medium mb-2 text-sm pl-1">Usuário</label>
                <div class="relative flex items-center input-bg rounded-xl border border-transparent transition-all duration-300 input-glow-focus">
                    <!-- Ícone de Usuário -->
                    <div class="absolute left-4 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                        </svg>
                    </div>
                    <input type="text" id="username" placeholder="admin" required
                        class="w-full bg-transparent text-white text-base py-4 pl-12 pr-4 outline-none placeholder-gray-500 rounded-xl">
                </div>
            </div>

            <!-- Campo Senha -->
            <div>
                <label for="password" class="block text-white font-medium mb-2 text-sm pl-1">Senha</label>
                <div class="relative flex items-center input-bg rounded-xl border border-transparent transition-all duration-300 input-glow-focus">
                    <!-- Ícone de Cadeado -->
                    <div class="absolute left-4 text-gray-400">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                        </svg>
                    </div>
                    
                    <input type="password" id="password" placeholder="••••••••" required
                        class="w-full bg-transparent text-white text-base py-4 pl-12 pr-12 outline-none placeholder-gray-500 rounded-xl tracking-widest font-mono">
                    
                    <!-- Botão Mostrar/Ocultar Senha -->
                    <button type="button" id="togglePassword" class="absolute right-4 text-gray-400 hover:text-white transition-colors focus:outline-none">
                        <!-- Ícone de Olho -->
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <!-- Ícone de Olho Fechado (Escondido por padrão) -->
                        <svg id="eyeSlashIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 hidden">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Botão Entrar -->
            <div class="pt-4">
                <button type="submit" 
                    class="w-full bg-white text-blue-900 text-lg font-bold py-4 rounded-xl shadow-lg hover:bg-gray-100 transition-all transform hover:-translate-y-0.5 focus:outline-none focus:ring-4 focus:ring-white/50">
                    Entrar
                </button>
            </div>
            
        </form>
    </div>

    <script>
        // Lógica para alternar a visibilidade da senha
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');

        togglePassword.addEventListener('click', function () {
            // Alterna o tipo do input
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Remove o espaçamento de fonte monospace quando a senha está visível para melhor leitura
            if (type === 'text') {
                passwordInput.classList.remove('tracking-widest', 'font-mono');
            } else {
                passwordInput.classList.add('tracking-widest', 'font-mono');
            }

            // Alterna os ícones do olho
            eyeIcon.classList.toggle('hidden');
            eyeSlashIcon.classList.toggle('hidden');
        });

        // Função de envio do formulário (simulação)
        function handleLogin(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            
            // Feedback visual rápido
            btn.innerText = 'Autenticando...';
            btn.classList.add('opacity-80');
            
            // Simula um delay de carregamento
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.remove('opacity-80');
                
                // Exibe mensagem customizada
                const form = document.getElementById('loginForm');
                const msg = document.createElement('div');
                msg.className = 'mt-4 p-3 bg-green-500/20 text-green-300 border border-green-500/50 rounded-lg text-center text-sm font-medium';
                msg.innerText = 'Login efetuado com sucesso! Redirecionando...';
                
                // Remove mensagens antigas se houver
                const oldMsg = form.querySelector('.bg-green-500\\/20');
                if(oldMsg) oldMsg.remove();
                
                form.appendChild(msg);
            }, 1000);
        }
    </script>
</body>
</html>
